name: Build

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: macos-latest
            triplet: arm64-osx
          - os: windows-latest
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_LIBRARY_LINKAGE: static   # force static libraries for all platforms
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build perl

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja perl

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          if [ "$RUNNER_OS" == "Windows" ]; then
            .\vcpkg\bootstrap-vcpkg.bat
            .\vcpkg\vcpkg.exe install --triplet ${{ matrix.triplet }}
          else
            ./vcpkg/bootstrap-vcpkg.sh
            ./vcpkg/vcpkg install --triplet ${{ matrix.triplet }}
          fi
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=${{ matrix.triplet }}" >> $GITHUB_ENV
          echo "VCPKG_LIBRARY_LINKAGE=static" >> $GITHUB_ENV

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSTATIC_LINKING=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSTATIC_LINKING=ON -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chh1dd3n3r-${{ runner.os }}
          path: |
            build/chh1dd3n3r*
            build/Release/chh1dd3n3r.exe