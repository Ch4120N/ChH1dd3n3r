name: Build and Release (All Architectures)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux (4 Architectures) ----
          - os: ubuntu-24.04
            arch: x86 (32-bit)
            build_dir: build_x86
            artifact_name: linux-x86
            executable_name: ChH1dd3n3r
            vcpkg_triplet: x86-linux
            cmake_extra: ""
            toolchain: "cmake/i686-linux-gnu.cmake"
            install_deps: "sudo apt-get update && sudo apt-get install -y g++-i686-linux-gnu cmake ninja-build pkg-config"
            
          - os: ubuntu-24.04
            arch: x64 (64-bit)
            build_dir: build_x64
            artifact_name: linux-x64
            executable_name: ChH1dd3n3r
            vcpkg_triplet: x64-linux
            cmake_extra: ""
            toolchain: ""
            install_deps: "sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config"
            
          - os: ubuntu-24.04
            arch: armv7 (32-bit ARM)
            build_dir: build_armv7
            artifact_name: linux-armv7
            executable_name: ChH1dd3n3r
            vcpkg_triplet: arm-linux
            cmake_extra: ""
            toolchain: "cmake/arm-linux-gnueabihf.cmake"
            install_deps: "sudo apt-get update && sudo apt-get install -y g++-arm-linux-gnueabihf cmake ninja-build pkg-config"
            
          - os: ubuntu-24.04
            arch: arm64 (64-bit ARM)
            build_dir: build_arm64
            artifact_name: linux-arm64
            executable_name: ChH1dd3n3r
            vcpkg_triplet: arm64-linux
            cmake_extra: ""
            toolchain: "cmake/aarch64-linux-gnu.cmake"
            install_deps: "sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu cmake ninja-build pkg-config"

          # ---- macOS (2 Architectures) ----
          - os: macos-14
            arch: x64 (Intel)
            build_dir: build_x64
            artifact_name: macos-x64
            executable_name: ChH1dd3n3r
            vcpkg_triplet: x64-osx
            cmake_extra: "-DCMAKE_OSX_ARCHITECTURES=x86_64"
            toolchain: ""
            install_deps: "brew install cmake ninja pkg-config"
            
          - os: macos-14
            arch: arm64 (Apple Silicon)
            build_dir: build_arm64
            artifact_name: macos-arm64
            executable_name: ChH1dd3n3r
            vcpkg_triplet: arm64-osx
            cmake_extra: "-DCMAKE_OSX_ARCHITECTURES=arm64"
            toolchain: ""
            install_deps: "brew install cmake ninja pkg-config"

          # ---- Windows (3 Architectures) ----
          - os: windows-latest
            arch: x86 (32-bit)
            build_dir: build_x86
            artifact_name: windows-x86
            executable_name: ChH1dd3n3r.exe
            vcpkg_triplet: x86-windows-static
            cmake_extra: "-A Win32"
            toolchain: ""
            install_deps: ""
            
          - os: windows-latest
            arch: x64 (64-bit)
            build_dir: build_x64
            artifact_name: windows-x64
            executable_name: ChH1dd3n3r.exe
            vcpkg_triplet: x64-windows-static
            cmake_extra: "-A x64"
            toolchain: ""
            install_deps: ""
            
          - os: windows-latest
            arch: arm64 (64-bit ARM)
            build_dir: build_arm64
            artifact_name: windows-arm64
            executable_name: ChH1dd3n3r.exe
            vcpkg_triplet: arm64-windows-static
            cmake_extra: "-A ARM64"
            toolchain: ""
            install_deps: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        if: matrix.install_deps != ''
        shell: bash
        run: ${{ matrix.install_deps }}

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_LIBRARY_LINKAGE=static" >> $env:GITHUB_ENV
          # Manifest mode: reads vcpkg.json automatically
          .\vcpkg\vcpkg.exe install --triplet ${{ matrix.vcpkg_triplet }}

      - name: Setup vcpkg (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_LIBRARY_LINKAGE=static" >> $GITHUB_ENV
          if [ "${{ matrix.vcpkg_triplet }}" == "x86-linux" ]; then
            export CC=i686-linux-gnu-gcc
            export CXX=i686-linux-gnu-g++
          elif [ "${{ matrix.vcpkg_triplet }}" == "arm-linux" ]; then
            export CC=arm-linux-gnueabihf-gcc
            export CXX=arm-linux-gnueabihf-g++
          elif [ "${{ matrix.vcpkg_triplet }}" == "aarch64-linux" ]; then
            export CC=aarch64-linux-gnu-gcc
            export CXX=aarch64-linux-gnu-g++
          fi
          ./vcpkg/vcpkg install --triplet ${{ matrix.vcpkg_triplet }}

      - name: Configure CMake
        shell: bash
        run: |
          VCPKG_TOOLCHAIN="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
          EXTRA_FLAGS="${{ matrix.cmake_extra }} -DSTATIC_LINKING=ON -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}"
          
          if [ -n "${{ matrix.toolchain }}" ]; then
            cmake -B ${{ matrix.build_dir }} -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_TOOLCHAIN" \
              -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/${{ matrix.toolchain }}" \
              $EXTRA_FLAGS
          else
            cmake -B ${{ matrix.build_dir }} -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_TOOLCHAIN" \
              $EXTRA_FLAGS
          fi

      - name: Build
        shell: bash
        run: cmake --build ${{ matrix.build_dir }} --config Release --parallel

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          build_dir="${{ matrix.build_dir }}"
          
          if [ -f "$build_dir/chh1dd3n3r" ]; then
            cp "$build_dir/chh1dd3n3r" "release/${{ matrix.executable_name }}"
          elif [ -f "$build_dir/Release/chh1dd3n3r" ]; then
            cp "$build_dir/Release/chh1dd3n3r" "release/${{ matrix.executable_name }}"
          else
            echo "Error: Executable not found in build directory"
            exit 1
          fi
          
          file "release/${{ matrix.executable_name }}" || true
          
          cd release
          tar -czf "../ChH1dd3n3r-${{ matrix.artifact_name }}.tar.gz" "${{ matrix.executable_name }}"

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $buildDir = "${{ matrix.build_dir }}"
          $targetName = "${{ matrix.executable_name }}"
          
          if (Test-Path "$buildDir\chh1dd3n3r.exe") {
            Copy-Item "$buildDir\chh1dd3n3r.exe" "release\$targetName"
          } elseif (Test-Path "$buildDir\Release\chh1dd3n3r.exe") {
            Copy-Item "$buildDir\Release\chh1dd3n3r.exe" "release\$targetName"
          } else {
            Write-Error "Executable not found in build directory"
            exit 1
          }
          
          Compress-Archive -Path release\* -DestinationPath "ChH1dd3n3r-${{ matrix.artifact_name }}.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: |
            ChH1dd3n3r-${{ matrix.artifact_name }}.tar.gz
            ChH1dd3n3r-${{ matrix.artifact_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}